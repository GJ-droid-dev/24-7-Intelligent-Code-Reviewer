# ============================================================
# Cloud Build — Frontend CI/CD Pipeline
# ============================================================
# Builds the Next.js frontend container and deploys to Cloud Run.
#
# Trigger: Push to main branch (frontend/ directory changes)
#
# Required substitutions:
#   _REGION: Cloud Run region (e.g., us-central1)
#   _SERVICE_NAME: Cloud Run service name (e.g., code-reviewer-frontend)
#   _BACKEND_URL: Backend service URL
# ============================================================

steps:
  # Step 1: Build the Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "gcr.io/$PROJECT_ID/${_SERVICE_NAME}:${_TAG}",
        "--build-arg",
        "NEXT_PUBLIC_API_URL=${_BACKEND_URL}/api/v1",
        "--build-arg",
        "NEXT_PUBLIC_BACKEND_URL=${_BACKEND_URL}",
        "--build-arg",
        "NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}",
        "--build-arg",
        "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}",
        "--build-arg",
        "NEXT_PUBLIC_FIREBASE_PROJECT_ID=$PROJECT_ID",
        "--build-arg",
        "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET}",
        "--build-arg",
        "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID}",
        "--build-arg",
        "NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID}",
        "-f",
        "frontend/Dockerfile",
        "frontend/",
      ]

  # Step 2: Push the image to Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/${_SERVICE_NAME}:${_TAG}"]

  # Step 3: Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--image"
      - "gcr.io/$PROJECT_ID/${_SERVICE_NAME}:${_TAG}"
      - "--region"
      - "${_REGION}"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--service-account"
      - "frontend-sa@$PROJECT_ID.iam.gserviceaccount.com"
      - "--memory"
      - "512Mi"
      - "--cpu"
      - "1"
      - "--min-instances"
      - "0"
      - "--max-instances"
      - "5"
      - "--timeout"
      - "30s"

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: code-reviewer-frontend
  _BACKEND_URL: https://code-reviewer-backend-g4bxczv4yq-uc.a.run.app
  _FIREBASE_API_KEY: AIzaSyDGysNubyypGAQhGgYT1qgoQhM7gN5b1Vc
  _FIREBASE_AUTH_DOMAIN: daring-fiber-408912.firebaseapp.com
  _FIREBASE_STORAGE_BUCKET: daring-fiber-408912.firebasestorage.app
  _FIREBASE_MESSAGING_SENDER_ID: "459457000826"
  _FIREBASE_APP_ID: "1:459457000826:web:9c2c848ece0fe8257152c3"
  _TAG: latest

images:
  - "gcr.io/$PROJECT_ID/${_SERVICE_NAME}:${_TAG}"

options:
  logging: CLOUD_LOGGING_ONLY
