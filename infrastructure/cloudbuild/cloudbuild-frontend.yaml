# ============================================================
# Cloud Build — Frontend CI/CD Pipeline
# ============================================================
# Builds the Next.js frontend container and deploys to Cloud Run.
#
# Trigger: Push to main branch (frontend/ directory changes)
#
# Required substitutions:
#   _REGION: Cloud Run region (e.g., us-central1)
#   _SERVICE_NAME: Cloud Run service name (e.g., code-reviewer-frontend)
#   _BACKEND_URL: Backend service URL
# ============================================================

steps:
  # Step 1: Build the Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$SHORT_SHA",
        "-t",
        "gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest",
        "--build-arg",
        "NEXT_PUBLIC_BACKEND_URL=${_BACKEND_URL}",
        "-f",
        "frontend/Dockerfile",
        "frontend/",
      ]

  # Step 2: Push the image to Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$SHORT_SHA"]

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest"]

  # Step 3: Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--image"
      - "gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$SHORT_SHA"
      - "--region"
      - "${_REGION}"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--memory"
      - "256Mi"
      - "--cpu"
      - "1"
      - "--min-instances"
      - "0"
      - "--max-instances"
      - "5"
      - "--timeout"
      - "30s"

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: code-reviewer-frontend
  _BACKEND_URL: https://code-reviewer-backend-xxxxx.run.app

images:
  - "gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$SHORT_SHA"
  - "gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest"

options:
  logging: CLOUD_LOGGING_ONLY
